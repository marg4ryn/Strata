@if (facade.error()) {
  <app-analysis-error-modal
    [error]="facade.error()"
    [errorType]="facade.errorType()"
    [pendingAnalysis]="facade.pendingAnalysis()"
    (retry)="facade.retryAnalysis()"
    (cancel)="facade.cancelAnalysis()"
  ></app-analysis-error-modal>
} @else if (facade.isBusy()) {
  <app-analysis-progress-spinner
    [label]="debouncedLabel.value()"
    [isAborting]="facade.isAborting()"
    [pendingAnalysis]="facade.pendingAnalysis()"
    (abort)="facade.abortAnalysis()"
  ></app-analysis-progress-spinner>
} @else if (facade.showModal()) {
  <app-analysis-unfinished-modal
    [pendingAnalysis]="facade.pendingAnalysis()"
    (resume)="facade.resumeAnalysis()"
    (abandon)="facade.abandonAnalysis()"
  ></app-analysis-unfinished-modal>
} @else {
  <app-analysis-target-form
    (analysisTargetData)="facade.startNewAnalysis($event)"
  ></app-analysis-target-form>
}
