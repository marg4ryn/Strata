<div class="loading">
  <app-loading-spinner />
  <p class="loading__label">{{ labelKey() | transloco }}...</p>
  <button #firstButton btn="secondary" [disabled]="isAborting()" (click)="abortAnalysis()">
    {{
      (isAborting() ? 'analysisRun.progress.aborting' : 'analysisRun.progress.abort') | transloco
    }}
  </button>
</div>

<app-info-panel [pendingAnalysis]="pendingAnalysis()" />
