<div class="modal">
  <header class="modal__header">
    <h2 class="modal__title">{{ 'analysisRun.error.header' | transloco }}</h2>
  </header>

  <div class="modal__body">
    <p class="error-message">{{ error() }}</p>
  </div>

  <footer class="modal__footer">
    <button #cancelButton btn="secondary" (click)="cancelAnalysis()">
      {{ 'common.cancel' | transloco }}
    </button>

    @if (showRetry()) {
      <button #retryButton btn="primary" (click)="retryAnalysis()">
        {{ 'analysisRun.error.retry' | transloco }}
      </button>
    }
  </footer>
</div>

<app-info-panel [pendingAnalysis]="pendingAnalysis()" />
