<div
  class="settings-panel"
  cdkTrapFocus
  [cdkTrapFocus]="!innerOverlayOpen()"
  [cdkTrapFocusAutoCapture]="true"
>
  <div class="settings-panel__header">
    <span class="settings-panel__title">{{ 'settings.panel.header' | transloco }}</span>

    <div class="settings-panel__actions">
      <button
        type="button"
        class="settings-panel__close"
        [title]="'settings.panel.close' | transloco"
        [attr.aria-label]="'settings.panel.close' | transloco"
        (click)="facade.closePanel()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="16" y1="4" x2="4" y2="16"></line>
          <line x1="4" y1="4" x2="16" y2="16"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="settings-panel__list">
    <app-settings-section headerKey="settings.language.header">
      <app-language-switcher (openedChange)="innerOverlayOpen.set($event)" />
    </app-settings-section>
  </div>
</div>
