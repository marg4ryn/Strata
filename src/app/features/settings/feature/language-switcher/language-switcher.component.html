<button
  type="button"
  class="lang-switcher__trigger"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  [attr.aria-expanded]="isOpen()"
  aria-haspopup="listbox"
  (click)="toggle()"
>
  <span>{{ currentLabel }}</span>
  <svg
    class="lang-switcher__chevron"
    width="12"
    height="12"
    viewBox="0 0 12 12"
    fill="none"
    aria-hidden="true"
  >
    <path
      d="M2.5 4.5L6 8L9.5 4.5"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="isOpen()"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="close()"
  (detach)="close()"
  (attach)="onOverlayAttached()"
>
  <div class="lang-switcher__panel-wrapper" cdkTrapFocus [cdkTrapFocusAutoCapture]="false">
    <ul
      class="lang-switcher__panel"
      cdkListbox
      [cdkListboxValue]="[current()]"
      (cdkListboxValueChange)="select($event.value)"
    >
      @for (option of options; track option.value) {
        <li class="lang-switcher__option" [cdkOption]="option.value">
          {{ option.label }}
        </li>
      }
    </ul>
  </div>
</ng-template>
