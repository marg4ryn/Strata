<section class="data-section">
  <div class="data-section__header">
    <h2 class="data-section__title">
      {{ titleKey() | transloco }}
    </h2>

    <app-dropdown
      [options]="options"
      [value]="current()"
      classPrefix=""
      ariaLabel="Select language"
      (selectionChange)="select($event)"
    />
  </div>

  <app-line-chart [series]="series()" [aggregation]="current()" />
</section>
