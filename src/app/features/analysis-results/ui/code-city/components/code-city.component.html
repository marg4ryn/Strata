<div
  #wrapper
  class="code-city-wrapper"
  [class.code-city-wrapper--interactive]="hoveredNodeName() !== null"
>
  @if (initializationFailed()) {
    <div class="code-city-error" role="alert">
      <p>{{ 'analysisResults.codeCity.renderError' | transloco }}</p>
    </div>
  } @else if (!cityNode()) {
    <div class="code-city-placeholder">
      <p>{{ 'common.noData' | transloco }}</p>
    </div>
  } @else if (hoveredNodeName(); as name) {
    @if (pointerInside()) {
      <div
        class="code-city-tooltip"
        role="status"
        [style.transform]="
          'translate3d(' +
          cursorPosition().x +
          'px, ' +
          cursorPosition().y +
          'px, 0) translate(12px, 12px)'
        "
      >
        {{ name }}
      </div>
    }
  }
  <div #container class="code-city-container"></div>
</div>
