<app-data-section class="table-section">
  <ng-container slot="header">
    <span class="table-section__title">
      <ng-content />
    </span>
  </ng-container>

  <ng-container slot="content">
    @if (columns().length > 0) {
      <div class="table-section__scroll">
        <app-table [columns]="columns()" [rows]="rows()" />
      </div>
    } @else {
      <span class="table-section__no-data">
        {{ 'common.noData' | transloco }}
      </span>
    }
  </ng-container>
</app-data-section>
