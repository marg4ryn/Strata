<app-data-section class="line-chart-section">
  <ng-container slot="header">
    <div class="line-chart-section__header">
      <span class="line-chart-section__title">
        <ng-content />
      </span>
      @if (series().length > 0) {
        <app-dropdown
          class="line-chart-section__dropdown"
          [options]="options"
          [value]="selectedPeriod()"
          ariaLabelKey="analysisResults.repositoryDetails.lineChartSectionDropdown"
          (selectionChange)="select($event)"
        />
      }
    </div>
  </ng-container>
  <ng-container slot="content">
    @if (series().length > 0) {
      <app-line-chart [series]="series()" [period]="selectedPeriod()" [modes]="modes()" />
    } @else {
      <span class="line-chart-section__no-data">
        {{ 'common.noData' | transloco }}
      </span>
    }
  </ng-container>
</app-data-section>
