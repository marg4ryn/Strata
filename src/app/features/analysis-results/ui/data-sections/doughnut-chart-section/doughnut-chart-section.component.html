<app-data-section class="doughnut-chart-section">
  <ng-container slot="header">
    <span class="doughnut-chart-section__title">
      <ng-content />
    </span>
  </ng-container>
  <ng-container slot="content">
    @if (items().length > 0) {
      <app-doughnut-chart [items]="items()" />
    } @else {
      <span class="doughnut-chart-section__no-data">
        {{ 'common.noData' | transloco }}
      </span>
    }
  </ng-container>
</app-data-section>
