<app-resource-page [data]="resource">
  <ng-template #content let-data>
    <div class="code-city-shell">
      <div class="code-city-shell__panel code-city-shell__panel--template">
        <ng-container [ngTemplateOutlet]="state.template()" />
      </div>

      <div class="code-city-shell__panel code-city-shell__panel--explorer">
        <app-repo-explorer-panel
          [id]="id()"
          [cityNode]="data?.cityNode"
          [(selectedNodePath)]="this.state.selectedNodePath"
          [(hoveredNodePath)]="this.state.hoveredNodePath"
        />
      </div>

      <div class="code-city-shell__code-city">
        <app-code-city
          [cityNode]="data?.cityNode"
          [autoRotate]="autoRotate()"
          [colorData]="this.state.colorData()"
          [(selectedNodePath)]="this.state.selectedNodePath"
          [(hoveredNodePath)]="this.state.hoveredNodePath"
          [(keyboardNavigationActive)]="keyboardNavigationActive"
        ></app-code-city>
      </div>

      <div class="code-city-shell__searchbar">
        <app-search-bar
          [items]="data?.cityItems"
          [(selectedNodePath)]="this.state.selectedNodePath"
          [(hoveredNodePath)]="this.state.hoveredNodePath"
          [(keyboardNavigationActive)]="keyboardNavigationActive"
        />
      </div>

      <div class="code-city-shell__pause-play-button">
        <app-pause-play-button [(play)]="autoRotate" />
      </div>

      <div class="code-city-shell__page-content">
        <router-outlet />
      </div>
    </div>
  </ng-template>
</app-resource-page>
