<app-resource-page [data]="resource">
  <ng-template #content let-data>
    <div class="code-city-shell">
      <div class="code-city-shell__column code-city-shell__column--left">
        <ng-container [ngTemplateOutlet]="state.column()" />
      </div>

      <div class="code-city-shell__column code-city-shell__column--right"></div>

      <div class="code-city-shell__code-city">
        <app-code-city
          [cityNode]="data?.cityNode"
          [autoRotate]="autoRotate()"
          [colorData]="this.state.colorData()"
          [(selectedNode)]="this.state.selectedNode"
          [(hoveredNode)]="this.state.hoveredNode"
          [(keyboardNavigationActive)]="this.state.keyboardNavigationActive"
        ></app-code-city>
      </div>

      <div class="code-city-shell__searchbar">
        <app-search-bar
          [items]="data?.cityItems"
          [(selectedNode)]="this.state.selectedNode"
          [(hoveredNode)]="this.state.hoveredNode"
          [(keyboardNavigationActive)]="this.state.keyboardNavigationActive"
        />
      </div>

      <div class="code-city-shell__pause-play-button">
        <app-pause-play-button [(play)]="autoRotate" />
      </div>

      <div class="code-city-shell__page-content">
        <router-outlet />
      </div>
    </div>
  </ng-template>
</app-resource-page>
