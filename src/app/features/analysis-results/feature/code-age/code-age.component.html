<ng-template shellTemplate>
  <aside class="code-age">
    <div class="code-age__heading">
      <h3 class="code-age__heading-label">{{ 'analysisResults.codeAge.title' | transloco }}</h3>
      <app-info-tooltip
        class="code-age__heading-tooltip"
        [textKey]="'analysisResults.codeAge.info'"
        [iconSize]="20"
        [position]="'bottom'"
        [width]="300"
      />
    </div>
    <ul class="code-age__list">
      @for (item of codeAgeItems(); track item.name) {
        <li class="code-age__item">
          <span
            class="code-age__color"
            [style.background-color]="item.color"
            aria-hidden="true"
          ></span>
          <span class="code-age__name">{{
            'analysisResults.codeAge.' + item.name | transloco
          }}</span>
          <span class="code-age__value">{{ item.count | localizedNumber: '1.0-0' }}</span>
        </li>
      }
    </ul>
  </aside>
</ng-template>
