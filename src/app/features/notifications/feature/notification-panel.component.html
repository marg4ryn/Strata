<div class="notification-panel" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
  <div class="notification-panel__header">
    <span class="notification-panel__title">{{ 'notifications.panel.header' | transloco }}</span>

    <div class="notification-panel__actions">
      @if (facade.notifications()?.length) {
        <button
          type="button"
          class="notification-panel__clear-all"
          (click)="facade.clearNotifications()"
        >
          {{ 'notifications.panel.clear' | transloco }}
        </button>
      }
      <button
        type="button"
        class="notification-panel__close"
        [title]="'notifications.panel.close' | transloco"
        [attr.aria-label]="'notifications.panel.close' | transloco"
        (click)="facade.closePanel()"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 20 20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="16" y1="4" x2="4" y2="16"></line>
          <line x1="4" y1="4" x2="16" y2="16"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="notification-panel__list">
    @if (facade.notifications()?.length) {
      @for (n of facade.notifications(); track n.sentAt) {
        <app-notification-item [notification]="n" (remove)="facade.removeNotification($event)" />
      }
    } @else {
      <div class="notification-panel__empty">
        <p>{{ 'notifications.panel.empty' | transloco }}</p>
      </div>
    }
  </div>
</div>
